<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7df">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おかおマッチ！">
<title>おかおマッチ！</title>
<style>
:root{color-scheme:light;--ink:#332d29;--cream:#fff7df;--pink:#ff8f9c;--blue:#2878e5;--yellow:#ffcf4a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff7df,#ffeef0);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
main{max-width:480px;margin:auto;padding:18px 16px 28px;text-align:center;min-height:100dvh}
.kicker{font-size:13px;letter-spacing:2px;font-weight:700}.title{font-size:32px;margin:4px 0 8px}.progress{font-weight:700;font-size:14px}
.track{height:9px;background:#eadfcb;border-radius:20px;overflow:hidden;margin:12px 4px 18px}.bar{height:100%;width:25%;background:linear-gradient(90deg,#ff9e79,#ffca48);transition:width .25s}
.card{background:#fff;border:3px solid #fff;border-radius:28px;padding:18px 14px;box-shadow:0 8px 0 #f3d8c8}
.tip{font-size:17px;font-weight:800}.face{font-size:100px;line-height:1.25;margin:5px 0}.name{font-size:23px;font-weight:900}
.camera{position:relative;max-width:340px;aspect-ratio:4/3;background:#272727;border-radius:20px;overflow:hidden;margin:15px auto 10px;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none}.placeholder{color:white;padding:12px}.placeholder .emoji{font-size:48px}
.status{position:absolute;bottom:8px;left:8px;right:8px;color:#fff;background:#0009;border-radius:12px;padding:7px;font-size:13px}
.meter{min-height:24px;font-size:14px;font-weight:700;margin:7px 0}
button{width:100%;border:0;border-radius:16px;padding:15px 12px;font-size:17px;font-weight:900;cursor:pointer;touch-action:manipulation}
.primary{background:var(--blue);color:white}.secondary{background:var(--yellow);color:#392600;margin-top:9px}.small{font-size:12px;line-height:1.5;opacity:.75;margin:12px 4px 0}
.hidden{display:none!important}.finish{padding:18px 5px}.finish .trophy{font-size:76px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="kicker">かおをまねっこしよう！</div>
  <h1 class="title">おかおマッチ！</h1>
  <div id="progress" class="progress">ステージ 1 / 4</div>
  <div class="track"><div id="bar" class="bar"></div></div>
  <section id="game" class="card">
    <div id="tip" class="tip">このおかおをまねしてね！</div>
    <div id="face" class="face">😄</div>
    <div id="name" class="name">にこにこ笑顔</div>
    <div class="camera">
      <video id="video" autoplay playsinline muted></video>
      <div id="placeholder" class="placeholder"><div class="emoji">🤳</div><div>カメラでおかおをうつそう！</div></div>
      <div id="status" class="status">カメラをひらいてね</div>
    </div>
    <div id="meter" class="meter">お手本と同じ表情をしてみよう！</div>
    <button id="start" class="primary">📷 カメラと自動判定をスタート</button>
    <button id="next" class="secondary hidden">つぎへすすむ</button>
    <p class="small">表情認識は目安だよ。特に怒った顔や変顔は、うまく判定できないことがあります。</p>
  </section>
  <section id="finish" class="finish hidden">
    <div class="trophy">🏆</div><h2>ぜんぶクリア！</h2><p>すごい！おかおマッチのめいじん！</p>
    <button id="again" class="primary">もういっかい！</button>
  </section>
  <p class="small">カメラ映像はこのページ内で処理し、アプリ側から映像をアップロードしません。カメラ使用には許可が必要です。</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script>
(() => {
  const stages = [
    {emoji:"😄", name:"にこにこ笑顔", tip:"にっこり笑ってみよう！", key:"happy"},
    {emoji:"😠", name:"おこった顔", tip:"まゆげをキュッとしてみよう！", key:"angry"},
    {emoji:"🤪", name:"おもしろ変顔", tip:"びっくり顔や変顔をしてみよう！", key:"funny"},
    {emoji:"😆", name:"とびっきりの笑顔", tip:"さいごは大きく笑おう！", key:"happy"}
  ];
  const $ = id => document.getElementById(id);
  let index=0, stream=null, modelsReady=false, running=false, busy=false, timer=null, matchedSince=0, loadPromise=null;
  const setStatus = t => $("status").textContent=t;
  function render(){
    const s=stages[index];
    $("progress").textContent=`ステージ ${index+1} / ${stages.length}`;
    $("bar").style.width=`${(index+1)/stages.length*100}%`;
    $("face").textContent=s.emoji; $("name").textContent=s.name; $("tip").textContent=s.tip;
    $("meter").textContent="お手本と同じ表情をしてみよう！";
    $("next").classList.add("hidden"); $("start").classList.remove("hidden");
    $("start").disabled=running;
    $("start").textContent=running?"📷 自動判定中":"📷 カメラと自動判定をスタート";
    $("finish").classList.add("hidden"); $("game").classList.remove("hidden");
    matchedSince=0;
    if(running) setStatus("おかおをうつしてね！");
  }
  async function loadModels(){
    if(modelsReady)return;
    if(loadPromise)return loadPromise;
    loadPromise=(async()=>{
      if(!window.faceapi) throw new Error("表情認識ライブラリを読み込めません");
      setStatus("表情を見分ける準備中…");
      const base="https://justadudewhohacks.github.io/face-api.js/models";
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(base),
        faceapi.nets.faceExpressionNet.loadFromUri(base)
      ]);
      modelsReady=true;
    })();
    try{await loadPromise;}catch(e){loadPromise=null;throw e;}
  }
  function getScore(expressions){
    const e=expressions||{};
    if(stages[index].key==="happy") return e.happy||0;
    if(stages[index].key==="angry") return e.angry||0;
    return Math.max(e.surprised||0,e.disgusted||0,e.fearful||0);
  }
  function win(){
    if(busy||!running)return;
    busy=true; matchedSince=0;
    if(timer){clearInterval(timer);timer=null;}
    $("face").textContent="🎉";
    $("meter").textContent="せいかい！すごい！";
    setStatus("せいかい！");
    $("next").classList.remove("hidden"); $("start").classList.add("hidden");
  }
  async function detect(){
    if(!running||busy||!modelsReady||$("video").readyState<2)return;
    try{
      const result=await faceapi.detectSingleFace($("video"),new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:.45})).withFaceExpressions();
      if(!result){matchedSince=0;$("meter").textContent="おかおが見つからないよ。カメラを見てね！";setStatus("カメラに顔をうつしてね");return;}
      const score=getScore(result.expressions);
      const threshold=stages[index].key==="happy"?.72:stages[index].key==="angry"?.55:.48;
      if(score>=threshold){
        if(!matchedSince)matchedSince=Date.now();
        const left=Math.max(0,1200-(Date.now()-matchedSince));
        $("meter").textContent="そのおかお！そのままキープ！";
        setStatus(`いいね！ ${(left/1000).toFixed(1)}秒キープ！`);
        if(left===0)win();
      } else {
        matchedSince=0;
        $("meter").textContent="表情をもうちょっとまねしてみよう！";
        setStatus("お手本："+stages[index].name);
      }
    }catch(e){$("meter").textContent="表情を判定中…";}
  }
  async function start(){
    if(running)return;
    $("start").disabled=true;
    try{
      if(!navigator.mediaDevices?.getUserMedia) throw new Error("Safariの安全な接続（HTTPS）で開いてね");
      setStatus("カメラを起動中…");
      stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:"user",width:{ideal:640},height:{ideal:480}}});
      $("video").srcObject=stream; $("video").style.display="block"; $("placeholder").classList.add("hidden");
      await new Promise(resolve=>{$("video").onloadedmetadata=resolve;});
      await $("video").play();
      await loadModels();
      running=true; busy=false; $("start").disabled=true; $("start").textContent="📷 自動判定中";
      setStatus("お手本と同じ顔をしてね！");
      $("meter").textContent="同じ表情を1.2秒キープするとクリア！";
      timer=setInterval(detect,250);
    }catch(e){
      setStatus("起動できなかったよ");
      $("meter").textContent=(e&&e.message)||"カメラの許可とインターネット接続を確認してね。";
      $("start").disabled=false; $("start").textContent="もういちど試す";
      if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
    }
  }
  function next(){
    index++;
    if(index>=stages.length){
      if(timer){clearInterval(timer);timer=null;}
      running=false;busy=false;
      if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
      $("video").srcObject=null; $("video").style.display="none"; $("placeholder").classList.remove("hidden");
      $("game").classList.add("hidden"); $("finish").classList.remove("hidden");
      $("progress").textContent="ぜんぶクリア！"; $("bar").style.width="100%"; setStatus("ぜんぶクリア！");
    } else {busy=false;render();}
  }
  $("start").addEventListener("click",start);
  $("next").addEventListener("click",next);
  $("again").addEventListener("click",()=>{index=0;render();if(!running)start();});
  render();
})();
</script>
</body>
</html>
