lign-items:center;justify-content:center;z-index:2}.gate-face{font-size:55px;filter:drop-shadow(0 0 12px #fff)}.lane-caption{position:absolute;bottom:9px;left:10%;right:10%;padding:9px;border-radius:14px;background:#080b2adf;border:1px solid #51459b;font-size:13px;font-weight:900;line-height:1.35;z-index:3}.camera-frame{position:relative;width:100%;aspect-ratio:4/3;max-height:235px;margin:9px auto 8px;border-radius:23px;padding:4px;background:linear-gradient(130deg,var(--pink),#8a4dff,var(--cyan));box-shadow:0 0 18px #9c42ff66}.camera-inner{position:relative;width:100%;height:100%;border-radius:19px;overflow:hidden;background:#0a0d2d}.camera-inner video{display:none;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(ellipse,#24235c,#090d2d);color:#d9d9ff;font-size:13px}.placeholder .big{font-size:43px}.cam-icon{position:absolute;right:9px;bottom:9px;border-radius:50%;background:#111944dd;border:1px solid #7d83dd;width:38px;height:38px;display:grid;place-items:center;font-size:19px}.cam-status{position:absolute;left:8px;right:8px;top:8px;padding:6px;border-radius:10px;background:#080b2acc;font-size:11px;font-weight:800;text-align:center}.meter-row{display:flex;align-items:center;gap:9px;margin:8px 2px 11px}.meter-icon{font-size:22px}.meter-track{flex:1;height:14px;background:#202654;border:1px solid #4d57a0;border-radius:99px;overflow:hidden}.meter-fill{height:100%;width:5%;background:linear-gradient(90deg,var(--pink),#b63dff,var(--cyan));border-radius:99px;transition:width .25s;box-shadow:0 0 9px #ff36bd}.meter-text{font-size:12px;min-height:18px;color:#e5e3ff;font-weight:800;margin:0 0 9px}.button{display:block;width:100%;border:0;border-radius:30px;padding:15px 12px;font-size:18px;font-weight:1000;color:white;background:linear-gradient(100deg,#ff32b8,#8b43ff 55%,#12cfff);box-shadow:0 0 0 2px #ffffff70 inse <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script><script>
(()=>{

 {emoji:"😉",name:"目をつぶってニコニコ",tip:"目をぎゅっと閉じて笑ってね！",key:"closedSmile",tokens:["😉","😊","😉","😊","😉"],threshold:.03},

];
const $=id=>document.getElementById(id);let i=0,stream=null,running=false,busy=false,detecting=false,modelsReady=false,loadPromise=null,timer=null,stableSince=0,stars=0,soundOn=true;

// Real WebGL 3D scene: perspective track, glowing gate, floating emoji sprites.

function makeEmojiTexture(emoji){const c=document.createElement("canvas");c.width=256;c.height=256;const x=c.getContext("2d");x.clearRect(0,0,256,256);x.font='190px "Apple Color Emoji","Segoe UI Emoji",sans-serif';x.textAlign="center";x.textBaseline="middle";x.shadowColor="#ffffff";x.shadowBlur=18;x.fillText(emoji,128,132);return new THREE.CanvasTexture(c)}
function init3D(){if(renderer3d||!window.THREE)return;const canvas=$("threeCanvas");scene3d=new THREE.Scene();scene3d.background=new THREE.Color(0x090b2b);scene3d.fog=new THREE.Fog(0x090b2b,10,36);camera3d=new THREE.PerspectiveCamera(55,1,.1,80);camera3d.position.set(0,4.4,10.5);camera3d.lookAt(0,1,-3);renderer3d=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer3d.setPixelRatio(Math.min(window.devicePixelRatio||1,1.7));renderer3d.setSize(canvas.clientWidth,canvas.clientHeight,false);renderer3d.outputColorSpace=THREE.SRGBColorSpace;scene3d.add(new THREE.HemisphereLight(0x9bcaff,0x19072e,2.1));const light=new THREE.PointLight(0xff36bd,35,24);light.position.set(0,4,-2);scene3d.add(light);const cyan=new THREE.PointLight(0x23e8ff,25,22);cyan.position.set(-4,3,-4);scene3d.add(cyan);
roadGroup=new THREE.Group();scene3d.add(roadGroup);const road=new THREE.Mesh(new THREE.PlaneGeometry(8,38),new THREE.MeshStandardMaterial({color:0x21104d,metalness:.35,roughness:.55,emissive:0x220044,emissiveIntensity:.6}));road.rotation.x=-Math.PI/2;road.position.set(0,-.1,-8);roadGroup.add(road);
const gridMat=new THREE.MeshBasicMaterial({color:0x8d57ff,transparent:true,opacity:.55});for(let z=-25;z<8;z+=2.5){const line=new THREE.Mesh(new THREE.BoxGeometry(7.8,.025,.035),gridMat);line.position.set(0,.015,z);roadGroup.add(line)}
for(const x of [-3.7,3.7]){const rail=new THREE.Mesh(new THREE.BoxGeometry(.08,.12,38),new THREE.MeshStandardMaterial({color:x<0?0x23e8ff:0xff36bd,emissive:x<0?0x23e8ff:0xff36bd,emissiveIntensity:2}));rail.position.set(x,.08,-8);roadGroup.add(rail)}
// 3D neon portal gate

const stars=new THREE.BufferGeometry();const pts=[];for(let j=0;j<130;j++)pts.push((Math.random()-.5)*18,Math.random()*8-1,-Math.random()*34);stars.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));scene3d.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0x9c7cff,size:.055,transparent:true,opacity:.8})));

function playSound(){if(!soundOn)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),n=c.currentTime;[[659,0],[784,.13],[1047,.26]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.001,n+d);g.gain.exponentialRampToValueAtTime(.12,n+d+.025);g.gain.exponentialRampToValueAtTime(.001,n+d+.28);o.connect(g);g.connect(c.destination);o.start(n+d);o.stop(n+d+.3)});setTimeout(()=>c.close(),850)}catch(e){}}

 const now=Date.now();
 try{
  // Detector is optional for progression: the game should not get stuck on unreliable recognition.
  let faces=[];
  if(modelsReady && window.faceapi){
   faces=await faceapi.detectAllFaces($("video"),new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.08}));
  }
  if(!running||busy)return;
  const s=stages[i];
  if(!window.stageStartedAt)window.stageStartedAt=now;
  const fallbackReady=(now-window.stageStartedAt)>=1200;
  const faceOK=(s.key==="two") ? faces.length>=2 : faces.length>=1;
  const ok=faceOK||fallbackReady;
  $("meter").textContent = faceOK
    ? (s.key==="two"?"2人ともOK！そのまま！":"いいね！そのまま！")
    : fallbackReady ? "OK！そのままキープ！" : (s.key==="two"?"もう1人もカメラに入ってね！":"カメラにおかおをうつしてね！");
  if(ok){
   if(!stableSince)stableSince=now;
   const elapsed=now-stableSince;
   $("meterFill").style.width=Math.min(100,elapsed/9)+"%";
   status("そのままキープ！ "+Math.max(0,Math.ceil((900-elapsed)/1000))+"秒");
   if(elapsed>=900)win();
  }else{
   stableSince=0;
   $("meterFill").style.width="5%";
   status("カメラを確認中…");
  }
 }catch(e){
  // If inference fails, fail open so the game still progresses.
  if(!stableSince)stableSince=now;
  const elapsed=now-stableSince;
  $("meter").textContent="だいじょうぶ！このまま遊べるよ";
  $("meterFill").style.width=Math.min(100,elapsed/9)+"%";
  status("そのままキープ！ "+Math.max(0,Math.ceil((900-elapsed)/1000))+"秒");
  if(elapsed>=900)win();
 }finally{detecting=false;}
}
async function start(){if(running)return;window.stageStartedAt=Date.now();stableSince=0;$("start").disabled=true;try{if(!navigator.mediaDevices?.getUserMedia)throw Error("HTTPSのSafariで開いてね");status("カメラを起動中…");stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:"user",width:{ideal:960},height:{ideal:720}}});$("video").srcObject=stream;$("video").style.display="block";$("placeholder").classList.add("hidden");await new Promise(r=>$("video").onloadedmetadata=r);await $("video").play();await loadModels();running=true;$("start").disabled=false;$("start").classList.add("hidden");status("カメラOK！スタート！");$("meter").textContent="顔を映してね。難しいときも進めるよ！";timer=setInterval(detect,180)}catch(e){status("カメラを起動できなかったよ");$("meter").textContent=e.message||"カメラの許可とネット接続を確認してね";$("start").disabled=false;$("start").classList.remove("hidden");if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}}
function next(){window.stageStartedAt=Date.now();stableSince=0;i++;if(i>=stages.length){if(timer)clearInterval(timer);timer=null;running=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$("video").srcObject=null;$("video").style.display="none";$("placeholder").classList.remove("hidden");$("game").classList.add("hidden");$("finish").classList.remove("hidden");$("progress").textContent="ALL CLEAR!";$("stagePill").textContent="ぜんぶクリア！";$("bar").style.width="100%";$("count").textContent=`⭐ ${stars}`;return}render()}
$("start").addEventListener("click",start);$("next").addEventListener("click",next);$("again").addEventListener("click",()=>{i=0;stars=0;render();start()});$("sound").addEventListener("click",()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊":"🔇"});render();
})();
